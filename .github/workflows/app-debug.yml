name: App Debug APK

on:
  push:
    branches:
      - 'dev*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: ./.github/actions/load-build-versions
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: 'libcore/go.sum'
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
      - uses: actions/cache@v6
        with:
          path: composeApp/libs
          key: libcore-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('libcore/go.sum', 'libcore/build.sh', 'husi.properties') }}
          restore-keys: libcore-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare assets
        run: make assets
      - name: Build Android libcore
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: make libcore_android
      - name: Generate about libraries metadata
        run: make aboutlibraries_go aboutlibraries_android
      - name: Diagnose generated resources
        if: always()
        continue-on-error: true
        run: |
          ./gradlew :composeApp:generateResourceAccessorsForCommonMain :composeApp:generateResourceAccessorsForAndroidMain :composeApp:generateComposeResClass --no-daemon 2>&1 | tail -5
          echo "=== all files under build/generated (sample) ==="
          find composeApp/build/generated -type f 2>/dev/null | head -60
          echo "=== any Res*.kt anywhere in build ==="
          find composeApp/build -name 'Res.kt' -o -name '*ResAccessor*' 2>/dev/null | head
          echo "=== whole-tree grep easytier/arrow_back ==="
          grep -rn 'easytier_settings\|easytier_enable\|arrow_back' composeApp/build/generated composeApp/build/generatedSource 2>/dev/null | head -30
          echo "=== grep whole build for arrow_back accessor ==="
          grep -rln 'val arrow_back\|front/arrow_back\|drawable/arrow_back' composeApp/build/generated 2>/dev/null | head
          echo "=== Res.kt (first 80 lines) ==="
          f=$(find composeApp/build -name 'Res.kt' 2>/dev/null | head -1)
          echo "file: $f"
          sed -n '1,80p' "$f"
      - name: Build Android app (debug)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: make apk_debug
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: error
