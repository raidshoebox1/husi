name: Plugin EasyTier

on:
  push:
    tags:
      - 'plugin-easytier-v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/load-build-versions
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95'
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugin/easytier/src/main/rust/easytier
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Native build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./run plugin easytier
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: burrunan/gradle-cache-action@v3
      - name: Write signing properties
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: printf '%s' "$LOCAL_PROPERTIES" > local.properties
      - name: Gradle Build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          BUILD_PLUGIN: easytier
          SKIP_BUILD: on
        run: |
          if [ -s local.properties ]; then
            make plugin PLUGIN=easytier
          else
            echo "::notice::No signing secrets found, building debug APK"
            ./gradlew :plugin:easytier:assembleFossDebug --no-daemon
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-easytier
          path: plugin/easytier/build/outputs/apk/**/*.apk
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/plugin-easytier-')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: plugin-easytier
          path: plugin-easytier-artifacts
      - name: Publish GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mapfile -d '' files < <(find plugin-easytier-artifacts -type f -print0)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            ref_name="${{ github.ref_name }}"
            UPSTREAM_VERSION="${ref_name#plugin-easytier-}"
            UPSTREAM_VERSION="${UPSTREAM_VERSION%-*}"
            gh release create "$RELEASE_TAG" "${files[@]}" --prerelease --notes $'# :memo: Release Notes\n\nUpstream: https://github.com/EasyTier/EasyTier/releases/tag/'"$UPSTREAM_VERSION"
          fi
